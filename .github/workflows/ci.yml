name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
        working-directory: apps/cmstudio
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      # Integration tests start whole service stacks; run them one file at a time.
      - run: node --test --test-concurrency=1 test/*.test.mjs
      # Non-blocking until AI Studio passes in CI once.
      - run: pnpm test:aistudio
        continue-on-error: true
      - run: pnpm test
        working-directory: apps/cmstudio
      - run: pnpm test:browser
        working-directory: apps/cmstudio
